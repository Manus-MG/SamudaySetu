name: samudaysetu
description: "Samuday Setu — community, hierarchy and membership platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

# Every dependency here earns its place. The target device is a ~₹7,000 Android
# phone with 2 GB RAM on a 2G/3G connection, so an unused package is not free —
# it is APK size, cold-start time and one more thing that can break on upgrade.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI system. Brings lucide icons and flutter_animate with it.
  shadcn_ui: ^0.56.1

  # Declared explicitly rather than leaned on transitively through shadcn_ui:
  # depending on someone else's dependency means their minor bump is our breakage.
  flutter_animate: ^4.5.0

  # Photographs are fetched, not bundled: the APK stays small on a metered
  # connection, and the imagery can change without shipping a release. What
  # earns the dependency over a bare `Image.network` is the *disk* cache —
  # without it every cold start re-downloads the same hero over 2G, which for
  # this user is a real cost in rupees, not just in milliseconds. It also gives
  # us decode-size capping, which is what keeps a list of covers inside the
  # memory budget of a 2 GB device. See `core/widgets/app_network_image.dart`.
  cached_network_image: ^3.4.1

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0

  # Tokens go in the platform keystore/keychain.
  flutter_secure_storage: ^9.2.2
  # Non-secret flags only (has the user seen onboarding).
  shared_preferences: ^2.3.4

  # Opens WhatsApp, the dialer and the join link in a browser. It earns its place
  # because forwarding an invite on WhatsApp *is* the product's delivery
  # mechanism for a low-literacy audience — copying a URL to the clipboard and
  # hoping the user finds the right chat is not a substitute.
  url_launcher: ^6.3.1

  # The OS share sheet. `url_launcher` can only aim at one app it already knows
  # about; this hands the invite to whatever the user actually has — WhatsApp,
  # Telegram, SMS, Gmail, Bluetooth, a file manager — without us enumerating
  # them or shipping a new build when the answer changes. It is also the only
  # way to attach the QR *image* to a message, which is how a code reaches a
  # WhatsApp group that nobody will type a link into.
  share_plus: ^10.1.4

  # Writes the QR to the cache directory so it can be attached to a share. The
  # platform share APIs take a file path, not bytes, so this is not optional
  # once image sharing is in scope.
  path_provider: ^2.1.5

  # Scanning the leader's QR. The heaviest dependency here (~2 MB, it carries a
  # platform barcode engine), and it earns that: the alternative for a member is
  # reading a two-word code off someone else's screen and typing it, which is
  # exactly the step this audience fails at. Scoped to `formats: [qrCode]` at
  # the call site so nothing else is decoded.
  mobile_scanner: ^6.0.2

  # Receives `https://<host>/join/<code>` and `samudaysetu://join?code=<code>`
  # from the OS and hands them to go_router. Without it the intent-filters and
  # association files are inert — the app opens on the splash screen and the
  # code the user tapped is lost.
  app_links: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
